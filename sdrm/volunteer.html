---
layout: sdrm
sdrm_page: volunteer
permalink: /sdrm/volunteer/
tone: blue
---

<div data-sdrm-volunteer data-login-url="{{ '/sdrm/login/' | relative_url }}">
  <section class="sdrm__section sdrm__section--cream" aria-labelledby="vol-filter-heading">
    <div class="sdrm__container">
      <div class="sdrm__card">
        <h2 class="sdrm__card-title" id="vol-filter-heading" data-sdrm-text="volunteer.filters.heading"></h2>
        <form id="vol-filters" aria-describedby="vol-summary">
          <fieldset class="sdrm__fieldset">
            <legend class="sdrm__fieldset-legend">Days I'm available</legend>
            <div class="sdrm__fieldset-options" id="vol-days"></div>
          </fieldset>
          <fieldset class="sdrm__fieldset">
            <legend class="sdrm__fieldset-legend">I'm interested in</legend>
            <div class="sdrm__fieldset-options" id="vol-interests"></div>
          </fieldset>
          <div class="sdrm__actions">
            <button class="sdrm__button sdrm__button--outline" type="button" id="vol-clear">Clear choices</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <section class="sdrm__section sdrm__section--white" aria-labelledby="vol-results-heading">
    <div class="sdrm__container">
      <header class="sdrm__section-header">
        <p class="sdrm__kicker" data-sdrm-text="volunteer.results.kicker"></p>
        <h2 class="sdrm__section-heading" id="vol-results-heading" data-sdrm-text="volunteer.results.heading"></h2>
        <p class="sdrm__section-intro" id="vol-summary" role="status" aria-live="polite">Loading opportunities…</p>
      </header>
      <p class="sdrm__visually-hidden" id="vol-announce" aria-live="assertive"></p>

      <div class="sdrm__grid" id="vol-results"></div>

      <div class="sdrm__callout sdrm__callout--empty" id="vol-empty" hidden>
        <span class="sdrm__callout-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg></span>
        <h3 class="sdrm__callout-title">No shifts match yet</h3>
        <p class="sdrm__text">Try adding another day or interest, or clear your choices to see every shift.</p>
      </div>
    </div>
  </section>

  <section class="sdrm__section sdrm__section--dots" aria-label="About this demo">
    <div class="sdrm__container">
      <aside class="sdrm__callout">
        <p class="sdrm__text" data-sdrm-text="volunteer.note"></p>
      </aside>
    </div>
  </section>
</div>

<script type="module" src="{{ '/assets/js/sdrm/volunteer.js' | relative_url }}"></script>
