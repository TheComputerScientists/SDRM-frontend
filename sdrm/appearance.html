<section class="sdrm__section sdrm__section--white" aria-labelledby="appearance-options-heading">
  <div class="sdrm__container">
    <header class="sdrm__section-header">
      <p class="sdrm__kicker">Personalize your visit</p>
      <h2 class="sdrm__section-heading" id="appearance-options-heading">Choose a color theme</h2>
      <p class="sdrm__section-intro">Your choice is saved in this browser and applies across the SDRM pages.</p>
    </header>

    <fieldset class="sdrm__appearance-options">
      <legend class="sdrm__visually-hidden">Accent theme</legend>
      <label class="sdrm__appearance-option">

        <span class="sdrm__appearance-swatch sdrm__appearance-swatch--blue" aria-hidden="true"></span>
        <span>
          <strong>Site Default</strong>
          <span>The original site theme.</span>
        </span>
      </label>
      <label class="sdrm__appearance-option">
        <input type="radio" name="sdrm-theme" value="midnight" data-sdrm-theme-option>
        <span class="sdrm__appearance-swatch sdrm__appearance-swatch--midnight" aria-hidden="true"></span>
        <span>
          <strong>Midnight</strong>
          <span>A deep navy theme.</span>
        </span>
      </label>
      <label class="sdrm__appearance-option">
        <input type="radio" name="sdrm-theme" value="light" data-sdrm-theme-option>
        <span class="sdrm__appearance-swatch sdrm__appearance-swatch--light" aria-hidden="true"></span>
        <span>
          <strong>Light</strong>
          <span>A bright light theme.</span>
        </span>
      </label>
      <label class="sdrm__appearance-option">
        <input type="radio" name="sdrm-theme" value="green" data-sdrm-theme-option>
        <span class="sdrm__appearance-swatch sdrm__appearance-swatch--green" aria-hidden="true"></span>
        <span>
          <strong>Green</strong>
          <span>A calm green theme.</span>
        </span>
      </label>
      <label class="sdrm__appearance-option">
        <input type="radio" name="sdrm-theme" value="sepia" data-sdrm-theme-option>
        <span class="sdrm__appearance-swatch sdrm__appearance-swatch--sepia" aria-hidden="true"></span>
        <span>
          <strong>Sepia</strong>
          <span>A warm cream theme.</span>
        </span>
      </label>
      <label class="sdrm__appearance-option">
        <input type="radio" name="sdrm-theme" value="cyberpunk" data-sdrm-theme-option>
        <span class="sdrm__appearance-swatch sdrm__appearance-swatch--cyberpunk" aria-hidden="true"></span>
        <span>
          <strong>Cyberpunk</strong>
          <span>A neon dark theme.</span>
        </span>
      </label>
      <label class="sdrm__appearance-option">
        <input type="radio" name="sdrm-theme" value="ocean" data-sdrm-theme-option>
        <span class="sdrm__appearance-swatch sdrm__appearance-swatch--ocean" aria-hidden="true"></span>
        <span>
          <strong>Ocean</strong>
          <span>A deep blue theme.</span>
        </span>
      </label>
