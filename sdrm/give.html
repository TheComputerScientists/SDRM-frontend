---
layout: sdrm
sdrm_page: give
permalink: /sdrm/give/
tone: red
---

<div data-sdrm-give>
  <section class="sdrm__section sdrm__section--cream" aria-labelledby="calc-heading">
    <div class="sdrm__container sdrm__split">
      <div class="sdrm__card">
        <h2 class="sdrm__card-title" id="calc-heading" data-sdrm-text="give.calc.heading"></h2>
        <form id="give-form" novalidate>
          <div class="sdrm__field">
            <label class="sdrm__field-label" for="give-amount">Gift amount in US dollars</label>
            <input class="sdrm__input" id="give-amount" name="amount" type="text" inputmode="decimal" autocomplete="off" aria-describedby="give-hint give-error">
            <p class="sdrm__field-hint" id="give-hint">Numbers only, for example 25 or 25.50.</p>
            <p class="sdrm__field-error" id="give-error" role="alert"></p>
          </div>
          <div class="sdrm__field">
            <label class="sdrm__toggle" for="give-monthly">
              <input class="sdrm__toggle-input" id="give-monthly" name="monthly" type="checkbox">
              <span class="sdrm__toggle-track" aria-hidden="true"></span>
              <span class="sdrm__toggle-label">Make it a monthly gift (shows yearly totals too)</span>
            </label>
          </div>
          <button class="sdrm__button sdrm__button--red" type="submit">Calculate impact</button>
        </form>

        <div id="give-results" hidden>
          <h3>Your impact</h3>
          <p class="sdrm__text" id="give-summary" aria-live="polite"></p>
          <div class="sdrm__stats" id="give-stats"></div>
        </div>
      </div>
      <figure class="sdrm__figure sdrm__figure--red">
        <img class="sdrm__figure-image" alt="" data-sdrm-attr="src:give.calc.image,alt:give.calc.imageAlt" width="600" height="400">
      </figure>
    </div>
  </section>

  <section class="sdrm__section sdrm__section--white" aria-labelledby="rates-heading">
    <div class="sdrm__container">
      <header class="sdrm__section-header">
        <p class="sdrm__kicker" data-sdrm-text="give.rates.kicker"></p>
        <h2 class="sdrm__section-heading" id="rates-heading" data-sdrm-text="give.rates.heading"></h2>
      </header>
      <div class="sdrm__card">
        <div class="sdrm__table-wrap">
          <table class="sdrm__table">
            <caption class="sdrm__visually-hidden" data-sdrm-text="give.rates.caption"></caption>
            <thead>
              <tr><th scope="col" data-sdrm-text="give.rates.itemHeading"></th><th scope="col" data-sdrm-text="give.rates.costHeading"></th></tr>
            </thead>
            <tbody>
              <tr><td data-sdrm-text="give.rates.meal"></td><td id="rate-meal">Loading…</td></tr>
              <tr><td data-sdrm-text="give.rates.night"></td><td id="rate-night">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <p class="sdrm__callout" data-sdrm-text="give.rates.note"></p>
      </div>
    </div>
  </section>

  <section class="sdrm__section sdrm__section--dots" aria-labelledby="other-heading">
    <div class="sdrm__container">
      <header class="sdrm__section-header">
        <p class="sdrm__kicker" data-sdrm-text="give.other.kicker"></p>
        <h2 class="sdrm__section-heading" id="other-heading" data-sdrm-text="give.other.heading"></h2>
      </header>
      <div class="sdrm__grid">
        <template data-sdrm-list="give.other.cards">
          <article class="sdrm__card sdrm__card--topline">
            <h3 class="sdrm__card-title" data-sdrm-text=".title"></h3>
            <p class="sdrm__text" data-sdrm-text=".text"></p>
          </article>
        </template>
      </div>
      <p class="sdrm__actions">
        <a class="sdrm__button sdrm__button--red" rel="noopener" data-sdrm-text="give.other.cta" data-sdrm-attr="href:give.other.ctaHref"></a>
      </p>
    </div>
  </section>
</div>

<script type="module" src="{{ '/assets/js/sdrm/give.js' | relative_url }}"></script>
