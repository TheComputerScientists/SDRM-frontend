{%- comment -%} SDRM site footer: link columns and the required project disclaimer. Text and links come from /api/sdrm/content (site.*). {%- endcomment -%}
<footer class="sdrm__footer">
  <div class="sdrm__footer-inner">
    <div>
      <p class="sdrm__footer-brand" data-sdrm-text="site.name"></p>
      <p class="sdrm__footer-text" data-sdrm-text="site.footer.text"></p>
    </div>
    <nav aria-labelledby="footer-explore-heading">
      <h2 class="sdrm__footer-heading" id="footer-explore-heading" data-sdrm-text="site.footer.exploreHeading"></h2>
      <ul class="sdrm__footer-links">
        <template data-sdrm-list="site.footer.explore">
          <li><a class="sdrm__footer-link" data-sdrm-text=".label" data-sdrm-attr="href:.href"></a></li>
        </template>
      </ul>
    </nav>
    <nav aria-labelledby="footer-involved-heading">
      <h2 class="sdrm__footer-heading" id="footer-involved-heading" data-sdrm-text="site.footer.involvedHeading"></h2>
      <ul class="sdrm__footer-links">
        <template data-sdrm-list="site.footer.involved">
          <li><a class="sdrm__footer-link" data-sdrm-text=".label" data-sdrm-attr="href:.href"></a></li>
        </template>
      </ul>
    </nav>
    <div>
      <h2 class="sdrm__footer-heading" data-sdrm-text="site.footer.emergencyHeading"></h2>
      <p class="sdrm__footer-text" data-sdrm-text="site.footer.emergency"></p>
    </div>
  </div>
  <div class="sdrm__footer-bottom">
    <p class="sdrm__footer-note" data-sdrm-text="site.footer.note"></p>
  </div>
</footer>
